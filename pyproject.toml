[project]
name = "online-teacher"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1,<6.0",
    "django-jazzmin>=3.0",
    "Pillow>=10.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-storages[s3]>=1.14,<2.0",
    "vercel-blob>=0.5,<1.0",
]

[tool.vercel.scripts]
build = "python build.py"
